<!doctype html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PROJETO</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/panel.css">
	<link rel="stylesheet" href="css/project.css">
	<link rel="stylesheet" href="css/theme.css">
</head>

<body class="project-page">
	<main class="project" id="project">
		<!-- dados do projeto (gravados no próprio .aep) -->
		<div class="proj-fields">
			<div class="proj-row">
				<div class="has-field-icon proj-id" title="ID do projeto: as primeiras letras indicam a retranca (ex: EMP123456)">
					<svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 4 7.5 20M16.5 4l-2 16M4.5 9h15M3.5 15h15" /></svg>
					<input type="text" class="cfg-input" id="proj-id" placeholder="ID do projeto" spellcheck="false" autocomplete="off" aria-label="ID do projeto">
				</div>
				<div class="has-field-icon proj-user" title="sua sigla (só neste computador)">
					<svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5" /><path d="M5 19.5c.8-3.4 3.6-5.5 7-5.5s6.2 2.1 7 5.5" /></svg>
					<input type="text" class="cfg-input" id="proj-user" maxlength="6" spellcheck="false" autocomplete="off" aria-label="Sigla do usuário">
				</div>
			</div>
			<div class="has-field-icon" title="nome do projeto">
				<svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h6.5L18 8v11.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z" /><path d="M13.5 3.5V8H18M9 13h6M9 16.5h4" /></svg>
				<input type="text" class="cfg-input" id="proj-name" placeholder="nome do projeto" spellcheck="false" autocomplete="off" aria-label="Nome do projeto">
			</div>
		</div>

		<!-- retranca (pelo começo do ID) e a pasta onde o projeto vai ser salvo -->
		<section class="proj-card" id="proj-card">
			<div class="proj-card-head">
				<span class="proj-code" id="proj-code" hidden></span>
				<span class="proj-retranca" id="proj-retranca"></span>
			</div>
			<div class="proj-target" id="proj-target"></div>
			<button type="button" class="io-button io-output proj-open" id="btn-open" title="Abrir a pasta do projeto" aria-label="Abrir a pasta do projeto"><svg viewBox="0 0 24 24"><path d="M3.5 18V7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h7.5A1.5 1.5 0 0 1 20 10v1.5" /><g class="folder-content"><rect x="7" y="4.5" width="10" height="8" rx="1" /><path d="M9.5 4.5v8M14.5 4.5v8" /></g><path class="folder-front" d="M3.5 11.5h17V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z" /></svg></button>
		</section>

		<!-- os nomes que serão usados -->
		<dl class="proj-names">
			<div class="proj-name-row" title="nome do arquivo do projeto">
				<dt>arquivo</dt>
				<dd id="proj-file-name"></dd>
			</div>
			<div class="proj-name-row" title="nome das comps de render (as selecionadas ou, sem seleção, as que têm o comentário de render)">
				<dt id="proj-comps-label">comps</dt>
				<dd id="proj-comp-name"></dd>
			</div>
		</dl>

		<div class="proj-switches">
			<label class="cfg-switch" title="copia os arquivos usados no projeto para a pasta dele (project files) ao salvar">
				<input type="checkbox" id="proj-collect-files">
				<span class="cfg-switch-track"></span>
				<span class="cfg-switch-label">coletar arquivos</span>
			</label>
			<label class="cfg-switch" title="copia as fontes usadas no projeto para a pasta dele (FONTS) ao salvar">
				<input type="checkbox" id="proj-collect-fonts">
				<span class="cfg-switch-track"></span>
				<span class="cfg-switch-label">coletar fontes</span>
			</label>
		</div>

		<p class="proj-status" id="proj-status" aria-live="polite"></p>

		<footer class="proj-footer">
			<details class="actions-menu proj-menu" id="app-menu">
				<summary class="icon-button is-light" title="Mais opções" aria-label="Mais opções"><svg viewBox="0 0 24 24" class="anim-dots"><circle cx="6" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="18" cy="12" r="1.2" /></svg></summary>
				<div class="menu-popover">
					<button type="button" data-action="save-as">Salvar em outra pasta…</button>
					<button type="button" data-action="config">Configuração do projeto</button>
					<button type="button" data-action="docs">Ajuda / documentação</button>
					<button type="button" data-action="reload">Recarregar painel</button>
				</div>
			</details>
			<button type="button" class="button button-secondary" id="btn-rename">Renomear comps</button>
			<button type="button" class="button button-primary" id="btn-save">Salvar projeto</button>
		</footer>
	</main>

	<script src="js/motion.js"></script>
	<script src="js/tooltip.js"></script>
	<script src="js/bridge.js"></script>
	<script src="js/mock-host.js"></script>
	<script src="js/theme.js"></script>
	<script src="js/util.js"></script>
	<script src="js/keys.js"></script>
	<script src="js/project.js"></script>
</body>

</html>
