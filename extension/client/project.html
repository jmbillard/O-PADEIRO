<!doctype html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>A CLAQUETE</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/panel.css">
	<link rel="stylesheet" href="css/attractions.css">
	<link rel="stylesheet" href="css/project.css">
	<link rel="stylesheet" href="css/theme.css">
</head>

<body class="project-page">
	<!-- um projeto novo em duas telas (ATRAÇÃO → CRIAR); depois de criado, o editor.
	     as etapas são telas desta mesma janela: uma aparece por vez -->
	<main class="project" id="project">

		<!-- 1 · ATRAÇÃO: a busca já lista as atrações (a primeira vem marcada); no fim, "nova atração" (o nome e a
		     categoria abrem embaixo, na mesma tela) e "outra pasta…" -->
		<section class="wz-screen" id="sc-claquete" hidden>
			<p class="wz-title">ATRAÇÃO</p>
			<!-- a busca e a lista na mesma caixa (a lista com busca, js/attractions.js) -->
			<div class="combo combo-claq" id="claq-combo">
			<div class="has-field-icon wz-claq combo-field">
				<svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 3.5 3.5 4 3.5-4" /><rect x="3" y="7.5" width="18" height="13" rx="2.5" /><rect x="5.5" y="10" width="10.5" height="8" rx="2" /><path d="M18.5 11.5h.01M18.5 15h.01" /></svg>
				<input type="text" class="cfg-input" id="claq" placeholder="ex: DOMINGÃO" spellcheck="false" autocomplete="off" aria-label="Atração">
			</div>
			<div class="combo-panel" id="atr-list" role="listbox" aria-label="Atração" hidden></div>
			</div>
			<!-- nova atração: o nome e a categoria (entra logo abaixo do cartão "nova atração") -->
			<div class="atr-nova" id="atr-nova">
				<div class="atr-nova-box">
					<div class="atr-nova-row">
						<div class="has-field-icon">
							<svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h6.5L18 8v11.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z" /><path d="M13.5 3.5V8H18" /></svg>
							<input type="text" class="cfg-input" id="nova-name" placeholder="nome da atração" spellcheck="false" autocomplete="off" aria-label="Nome da atração nova">
						</div>
						<span class="select select-large"><select id="nova-base" aria-label="Categoria"></select></span>
						<!-- sem categorias na configuração: a pasta é livre -->
						<button type="button" class="wz-pick" id="nova-pick" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18V7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z" /></svg><span>escolher a pasta…</span></button>
					</div>
					<p class="wz-hint" id="nova-free" hidden>sem categorias na configuração (aba PROJETO): escolha a pasta onde a atração nova vai ficar.</p>
					<p class="wz-preview" id="nova-preview"></p>
				</div>
			</div>
			<p class="wz-hint" id="claq-hint"></p>
			<footer class="wz-foot">
				<span></span>
				<button type="button" class="button button-primary" id="claq-next" disabled>Próximo</button>
			</footer>
		</section>

		<!-- 2 · CRIAR: o que é (o nome do .aep e a claquete são a atração + isso), a estrutura e a pasta de output -->
		<section class="wz-screen" id="sc-criar" hidden>
			<!-- o título e, na mesma linha, as pílulas da atração e do designer -->
			<div class="wz-title-row">
				<p class="wz-title">CRIAR</p>
				<div class="wz-meta" id="criar-meta"></div>
			</div>
			<div class="has-field-icon">
				<svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h6.5L18 8v11.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z" /><path d="M13.5 3.5V8H18" /></svg>
				<input type="text" class="cfg-input" id="arq-what" placeholder="ex: SERVIÇO, CONVIDADO, AESP" spellcheck="false" autocomplete="off" aria-label="O que é">
			</div>
			<p class="wz-exist" id="arq-exist" hidden></p>
			<!-- o .aep já existe: abrir o existente ou salvar como … 2, ali mesmo -->
			<div class="arq-dup" id="arq-dup" hidden>
				<p class="arq-dup-note" id="arq-dup-note"></p>
				<div class="wz-radios" role="radiogroup" aria-label="O arquivo já existe">
					<label class="log-radio"><input type="radio" name="arq-dup" value="open"><span class="log-radio-dot" aria-hidden="true"></span><span class="log-radio-text">abrir o existente</span></label>
					<label class="log-radio"><input type="radio" name="arq-dup" value="increment" checked><span class="log-radio-dot" aria-hidden="true"></span><span class="log-radio-text" id="arq-increment">salvar como … 2</span></label>
				</div>
			</div>
			<div class="wz-tree" id="criar-tree"></div>
			<!-- a pasta de output numa linha só; o clique abre as opções ali (a escolha fica lembrada neste computador) -->
			<div class="out-box" id="criar-opts"></div>
			<footer class="wz-foot">
				<button type="button" class="wz-back" data-back>‹ voltar</button>
				<button type="button" class="button button-primary" id="criar-go">Criar projeto</button>
			</footer>
		</section>

		<!-- depois de criado: o editor -->
		<section class="wz-screen" id="sc-editor" hidden>
			<!-- a atração (buscada como na etapa ATRAÇÃO) e o designer; o que é; embaixo, o nome do .aep (a atração + o que é) -->
			<p class="wz-title">ATRAÇÃO</p>
			<div class="ed-row">
				<!-- a atração: a lista com busca (a lista abre embaixo, na mesma caixa) -->
				<div class="combo ed-atr" id="ed-combo">
					<div class="has-field-icon combo-field">
						<svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 3.5 3.5 4 3.5-4" /><rect x="3" y="7.5" width="18" height="13" rx="2.5" /><rect x="5.5" y="10" width="10.5" height="8" rx="2" /><path d="M18.5 11.5h.01M18.5 15h.01" /></svg>
						<input type="text" class="cfg-input" id="ed-atracao" placeholder="ex: DOMINGÃO" spellcheck="false" autocomplete="off" aria-label="Atração">
					</div>
					<div class="combo-panel" id="ed-atr-list" role="listbox" aria-label="Atração" hidden></div>
				</div>
				<div class="has-field-icon ed-user" title="designer">
					<svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5" /><path d="M5 19.5c.8-3.4 3.6-5.5 7-5.5s6.2 2.1 7 5.5" /></svg>
					<input type="text" class="cfg-input" id="ed-user" maxlength="24" spellcheck="false" autocomplete="off" aria-label="Designer">
				</div>
			</div>
			<p class="wz-hint" id="ed-hint" hidden></p>
			<p class="wz-title">O QUE É</p>
			<div class="has-field-icon">
				<svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h6.5L18 8v11.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z" /><path d="M13.5 3.5V8H18" /></svg>
				<input type="text" class="cfg-input" id="ed-what" placeholder="ex: SERVIÇO, CONVIDADO, AESP" spellcheck="false" autocomplete="off" aria-label="O que é">
			</div>
			<p class="wz-preview" id="ed-file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h6.5L18 8v11.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z" /><path d="M13.5 3.5V8H18" /></svg><span></span></p>
			<!-- as pastas: o caminho e a pastinha no campo (o nosso padrão), como na configuração -->
			<p class="wz-title">PASTA</p>
			<div class="cfg-path ed-path"><input type="text" class="cfg-input" id="ed-root" readonly aria-label="Pasta do projeto"><button type="button" class="mini-button" id="ed-move" title="trocar a pasta (leva o .aep e a estrutura para outra pasta)" aria-label="trocar a pasta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 17z" /></svg></button></div>
			<p class="wz-title">OUTPUT</p>
			<div class="cfg-path ed-path"><input type="text" class="cfg-input" id="ed-output" readonly placeholder="sem pasta de output" aria-label="Pasta de output"><button type="button" class="mini-button" id="ed-output-pick" title="escolher a pasta de output" aria-label="escolher a pasta de output"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5v7a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 17z" /></svg></button></div>
			<footer class="wz-foot">
				<span class="ed-left">
					<details class="actions-menu proj-menu" id="app-menu">
						<summary class="icon-button is-light" title="Mais opções" aria-label="Mais opções"><svg viewBox="0 0 24 24" class="anim-dots"><circle cx="6" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="18" cy="12" r="1.2" /></svg></summary>
						<div class="menu-popover">
							<button type="button" data-action="new">Novo projeto</button>
							<button type="button" data-action="open">Abrir a pasta</button>
							<button type="button" data-action="docs">Ajuda / documentação</button>
							<button type="button" data-action="reload">Recarregar painel</button>
						</div>
					</details>
				</span>
				<button type="button" class="button button-primary" id="ed-save">Salvar</button>
			</footer>
		</section>

		<p class="proj-status" id="proj-status" aria-live="polite"></p>
	</main>
	<script src="js/motion.js"></script>
	<script src="js/tooltip.js"></script>
	<script src="js/bridge.js"></script>
	<script src="js/mock-host.js"></script>
	<script src="js/theme.js"></script>
	<script src="icons/_snapshot.js"></script>
	<script src="js/util.js"></script>
	<script src="js/dropdown.js"></script>
	<script src="js/keys.js"></script>
	<script src="js/local-index.js"></script>
	<script src="js/attractions.js"></script>
	<script src="js/project.js"></script>
</body>

</html>
