<!doctype html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>O CATADOR</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/panel.css">
	<link rel="stylesheet" href="css/attractions.css">
	<link rel="stylesheet" href="css/icons.css">
	<link rel="stylesheet" href="css/fonts.css">
	<link rel="stylesheet" href="css/collect.css">
	<link rel="stylesheet" href="css/theme.css">
</head>

<body class="fonts-page collect-page">
	<!-- as mídias do projeto: uma linha por arquivo, com a miniatura, o tipo, os layers e o estado (na pasta do
	     projeto, na rede, neste computador, faltando). clicar mostra o item no painel Project. Coletar copia para a
	     estrutura do projeto; a pasta do rodapé coleta em outra pasta; o triângulo procura os arquivos faltando
	     (no volume certo e, pelo nome, nas pastas do projeto) e mostra onde achou; o botão principal relinka -->
	<main class="fonts" id="collect">
		<p class="fw-file" id="fw-file"></p>
		<!-- o resumo: quantos arquivos em cada situação; cada etiqueta liga e desliga a situação na lista -->
		<div class="cw-filter" id="cw-filter" hidden></div>
		<div class="fw-list" id="fw-list"></div>
		<p class="fw-empty" id="fw-empty" hidden></p>

		<!-- a migração (menu ⋯): a pasta de hoje à esquerda, a estrutura da configuração à direita e as faixas, por tipo
		     de arquivo, ligando o que vai para onde (collect.js) -->
		<div class="mg" id="mg" hidden></div>

		<div class="action-bar is-anchored fw-bar">
			<button type="button" class="io-button" id="mg-back" title="voltar para a lista de arquivos" aria-label="voltar para a lista de arquivos" hidden><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" /></svg></button>
			<button type="button" class="io-button io-output" id="cw-other" title="coletar em outra pasta…" aria-label="coletar em outra pasta"><svg viewBox="0 0 24 24" class="anim-folder"><path d="M3.5 18V7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h6.5A1.5 1.5 0 0 1 19 10v1.5" /><path class="folder-front" d="M3.5 11.5h17V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z" /></svg></button>
			<button type="button" class="io-button cw-relink" id="cw-relink" title="procurar os arquivos faltando: nos volumes da rede (montando se precisar) e, pelo nome, nas pastas do projeto. mostra onde achou cada um, para relinkar" aria-label="resolver arquivos faltando" disabled><svg viewBox="0 0 24 24"><path class="relink-tri" d="M10.3 4.6a2 2 0 0 1 3.4 0l7.1 12.3a2 2 0 0 1-1.7 3H4.9a2 2 0 0 1-1.7-3z" /><g class="relink-mark"><path d="M12 9.5v4.2" /><path d="M12 16.9v.1" /></g></svg></button>
			<details class="actions-menu fw-menu" id="app-menu">
				<summary class="icon-button is-light" title="Mais opções" aria-label="Mais opções"><svg viewBox="0 0 24 24" class="anim-dots"><circle cx="6" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="18" cy="12" r="1.2" /></svg></summary>
				<div class="menu-popover">
					<button type="button" data-action="migrate">Migrar a pasta para a estrutura nova…</button>
					<button type="button" data-action="folder">Abrir a pasta do projeto</button>
					<button type="button" data-action="docs">Ajuda / documentação</button>
					<button type="button" data-action="reload">Recarregar painel</button>
				</div>
			</details>
			<span class="fw-status" id="fw-status" aria-live="polite"></span>
			<button type="button" class="button button-primary" id="cw-go" disabled>Coletar</button>
		</div>
	</main>

	<script src="js/motion.js"></script>
	<script src="js/tooltip.js"></script>
	<script src="js/bridge.js"></script>
	<script src="js/mock-host.js"></script>
	<script src="js/theme.js"></script>
	<script src="icons/_snapshot.js"></script>
	<script src="js/util.js"></script>
	<script src="js/keys.js"></script>
	<script src="js/collect.js"></script>
</body>

</html>
