<!doctype html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CONVERSOR DE CAMINHOS</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/panel.css">
	<link rel="stylesheet" href="css/converter.css">
</head>

<body class="converter-page">
	<main class="converter" id="converter">
		<div class="convert-field">
			<label class="eyebrow" for="cv-mac">MacOS</label>
			<div class="convert-line">
				<input class="convert-input" id="cv-mac" type="text" spellcheck="false" autocomplete="off" placeholder="/Volumes/SHARE/pasta">
				<button type="button" class="convert-pill" id="cv-copy-mac" title="copiar o caminho MacOS">copiar</button>
			</div>
		</div>

		<div class="convert-field">
			<label class="eyebrow" for="cv-win">Windows</label>
			<div class="convert-line">
				<input class="convert-input" id="cv-win" type="text" spellcheck="false" autocomplete="off" placeholder="\\servidor\SHARE\pasta">
				<button type="button" class="convert-pill" id="cv-copy-win" title="copiar o caminho Windows">copiar</button>
			</div>
		</div>

		<div class="convert-actions">
			<button type="button" class="convert-open" id="cv-open" title="abrir a pasta no Finder / Explorer">Abrir pasta</button>
			<span class="convert-status" id="cv-status" aria-live="polite"></span>
		</div>

		<footer class="convert-footer">
			<button type="button" class="icon-button" id="btn-last" title="Usar a pasta da última saída da fila de render" aria-label="Usar a pasta da última saída da fila de render">
				<svg viewBox="0 0 24 24" class="anim-refresh"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 5v6h-6" /></svg>
			</button>
			<details class="actions-menu convert-menu" id="app-menu">
				<summary class="icon-button" title="Mais opções" aria-label="Mais opções"><svg viewBox="0 0 24 24" class="anim-dots"><circle cx="6" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="18" cy="12" r="1.2" /></svg></summary>
				<div class="menu-popover">
					<button type="button" data-action="docs">Ajuda / documentação</button>
					<button type="button" data-action="reload">Recarregar painel</button>
				</div>
			</details>
		</footer>
	</main>

	<script src="js/tooltip.js"></script>
	<script src="js/bridge.js"></script>
	<script src="js/mock-host.js"></script>
	<script src="js/util.js"></script>
	<script src="js/keys.js"></script>
	<script src="js/converter.js"></script>
</body>

</html>
