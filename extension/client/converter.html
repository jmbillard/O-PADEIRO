<!doctype html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CONVERSOR DE CAMINHOS</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/panel.css">
	<link rel="stylesheet" href="css/converter.css">
</head>

<body class="converter-page">
	<main class="converter" id="converter">
		<div class="convert-field">
			<label class="convert-label" for="cv-mac">MacOS</label>
			<div class="convert-line">
				<input class="cfg-input convert-input" id="cv-mac" type="text" spellcheck="false" autocomplete="off" placeholder="/Volumes/SHARE/pasta">
				<div class="convert-tools">
					<button type="button" class="mini-button convert-tool" id="cv-open-mac" title="abrir a pasta no Finder" aria-label="abrir a pasta no Finder" hidden><svg viewBox="0 0 24 24"><path d="M3.5 18V7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z" /></svg></button>
					<button type="button" class="mini-button convert-tool convert-copy" id="cv-copy-mac" title="copiar o caminho MacOS" aria-label="copiar o caminho MacOS"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="15.500" rx="2" /><path d="M9.500 3.500h5a1 1 0 0 1 1 1V6.500h-7V4.500a1 1 0 0 1 1-1z" /><path class="clip-check" d="m9 13 2.200 2.200L15.500 11" /></svg></button>
				</div>
			</div>
		</div>

		<div class="convert-field">
			<label class="convert-label" for="cv-win">Windows</label>
			<div class="convert-line">
				<input class="cfg-input convert-input" id="cv-win" type="text" spellcheck="false" autocomplete="off" placeholder="\\servidor\SHARE\pasta">
				<div class="convert-tools">
					<button type="button" class="mini-button convert-tool" id="cv-open-win" title="abrir a pasta no Explorer" aria-label="abrir a pasta no Explorer" hidden><svg viewBox="0 0 24 24"><path d="M3.5 18V7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h8a1.5 1.5 0 0 1 1.5 1.5V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z" /></svg></button>
					<button type="button" class="mini-button convert-tool convert-copy" id="cv-copy-win" title="copiar o caminho Windows" aria-label="copiar o caminho Windows"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="15.500" rx="2" /><path d="M9.500 3.500h5a1 1 0 0 1 1 1V6.500h-7V4.500a1 1 0 0 1 1-1z" /><path class="clip-check" d="m9 13 2.200 2.200L15.500 11" /></svg></button>
				</div>
			</div>
		</div>

		<footer class="convert-footer">
			<nav class="convert-crumbs" id="cv-crumbs" aria-label="Pastas do caminho"></nav>
			<span class="convert-status" id="cv-status" aria-live="polite"></span>
			<details class="actions-menu convert-menu" id="app-menu">
				<summary class="icon-button is-light" title="Mais opções" aria-label="Mais opções"><svg viewBox="0 0 24 24" class="anim-dots"><circle cx="6" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="18" cy="12" r="1.2" /></svg></summary>
				<div class="menu-popover">
					<button type="button" data-action="docs">Ajuda / documentação</button>
					<button type="button" data-action="reload">Recarregar painel</button>
				</div>
			</details>
		</footer>
	</main>

	<script src="js/motion.js"></script>
	<script src="js/tooltip.js"></script>
	<script src="js/bridge.js"></script>
	<script src="js/mock-host.js"></script>
	<script src="js/util.js"></script>
	<script src="js/keys.js"></script>
	<script src="js/converter.js"></script>
</body>

</html>
