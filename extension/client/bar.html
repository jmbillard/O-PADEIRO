<!doctype html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>O PADEIRO</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/panel.css">
	<link rel="stylesheet" href="css/bar.css">
	<link rel="stylesheet" href="css/icons.css">
	<link rel="stylesheet" href="css/theme.css">
</head>

<body class="bar-page">

	<main class="bar" id="bar">
		<!-- rede ou modo local (ligado na configuração ou com a rede fora), na ponta oposta à do pãozinho:
		     preenchido pelo bar.js -->
		<div class="bar-group bar-status">
			<button type="button" class="bar-icon bar-net" id="net-status" hidden></button>
		</div>

		<div class="bar-main">
		<!-- links da equipe (configuração > links): preenchidos pelo bar.js -->
		<div class="bar-group bar-pin" id="links" hidden></div>

		<span class="bar-divider" id="links-divider" hidden></span>

		<div class="bar-group bar-tools" id="tools"></div>
		</div>

		<div class="bar-group bar-info">
			<button type="button" class="bar-logo" id="logo" title="O PADEIRO · ajuda | DOCS" aria-label="O PADEIRO">
				<svg class="bar-loaf" viewBox="0 0 48 32" aria-hidden="true">
					<defs>
						<linearGradient id="loaf-grad" x1="0" y1="0" x2="0" y2="1">
							<stop offset="0" stop-color="#fbd697" />
							<stop offset="1" stop-color="#e29a4c" />
						</linearGradient>
					</defs>
					<path class="loaf-body" d="M7 24C7 12.6 14.6 5 24 5s17 7.6 17 19v3a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z" fill="url(#loaf-grad)" />
					<path class="loaf-line" d="M7.6 23.2h32.8" />
					<path class="loaf-scores" d="m18.2 10.8 1.4 4.2M23.4 9.4l1.3 4.6M28.6 10.8l1.4 4.2" />
				</svg>
				<span class="bar-version" id="version">v0.1.0</span>
			</button>
		</div>

		<div class="bar-toast" id="toast" role="status" aria-live="polite" hidden></div>
	</main>

	<script src="js/motion.js"></script>
	<script src="js/tooltip.js"></script>
	<script src="js/bridge.js"></script>
	<script src="js/mock-host.js"></script>
	<script src="js/theme.js"></script>
	<script src="icons/_snapshot.js"></script>
	<script src="js/util.js"></script>
	<script src="js/keys.js"></script>
	<script src="js/dropdown.js"></script>
	<script src="js/icons.js"></script>
	<script src="js/fontbank.js"></script>
	<script src="js/aepversion.js"></script>
	<script src="js/bar.js"></script>
</body>

</html>
