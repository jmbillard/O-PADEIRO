<!doctype html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>O PADEIRO</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/panel.css">
	<link rel="stylesheet" href="css/bar.css">
	<link rel="stylesheet" href="css/icons.css">
	<link rel="stylesheet" href="css/tour.css">
	<link rel="stylesheet" href="css/theme.css">
</head>

<body class="bar-page">

	<main class="bar" id="bar">
		<!-- rede ou modo local (ligado na configuração ou com a rede fora), na ponta oposta à do pãozinho:
		     preenchido pelo bar.js -->
		<div class="bar-group bar-status">
			<button type="button" class="bar-icon bar-net" id="net-status" hidden></button>
		</div>

		<div class="bar-main">
		<!-- links da equipe (configuração > links): preenchidos pelo bar.js -->
		<div class="bar-group bar-pin" id="links" hidden></div>

		<span class="bar-divider" id="links-divider" hidden></span>

		<div class="bar-group bar-tools" id="tools"></div>
		</div>

		<div class="bar-group bar-info">
			<button type="button" class="bar-logo" id="logo" title="O PADEIRO
◖  →  ajuda | DOCS
◗  →  refazer o tour da barra" aria-label="O PADEIRO">
				<svg class="bar-loaf" viewBox="0 0 48 32" aria-hidden="true">
					<defs>
						<linearGradient id="loaf-grad" x1="0" y1="0" x2="0" y2="1">
							<stop offset="0" stop-color="#fbd697" />
							<stop offset="1" stop-color="#e29a4c" />
						</linearGradient>
					</defs>
					<!-- dezembro (até o dia 25): o gorro. atrás do pão, a ponta com o pompom (só ela balança) -->
					<g class="xmas-hat"><g class="xmas-tip">
						<path class="xmas-line" d="M35.4 1.4c3.8 1.4 6.8 3.8 8.4 6.6 1.4 2.4 1.8 5 1.6 7.6l-.4 2.6-3.8-4.4c-.8-4.6-2.8-9-5.8-12.4z" />
						<path class="xmas-red" d="M35.4 1.4c3.8 1.4 6.8 3.8 8.4 6.6 1.4 2.4 1.8 5 1.6 7.6l-.4 2.6-3.8-4.4c-.8-4.6-2.8-9-5.8-12.4z" />
						<circle class="xmas-fur" cx="45.2" cy="18.4" r="3.5" />
					</g></g>
					<path class="loaf-body" d="M7 24C7 12.6 14.6 5 24 5s17 7.6 17 19v3a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z" fill="url(#loaf-grad)" />
					<path class="loaf-line" d="M7.6 23.2h32.8" />
					<path class="loaf-scores" d="m18.2 10.8 1.4 4.2M23.4 9.4l1.3 4.6M28.6 10.8l1.4 4.2" />
					<!-- na frente: a copa (contorno só por fora: o traço embaixo e a cor por cima), a dobra que separa a
					     ponta e a faixa branca, inclinada para a direita -->
					<g class="xmas-hat">
						<path class="xmas-top" d="M8 14.4C7.8 5.6 14.4-.4 23.4-1.2c5.2-.5 9.4.6 12.4 2.6" />
						<path class="xmas-red" d="M8 14.4C7.8 5.6 14.4-.4 23.4-1.2c5.2-.5 9.4.6 12.4 2.6 2.2 1.4 4.4 2.8 5.6 4.6 1.8 4.2 1.4 8.8-.6 13.2C30.4 12.4 17.4 10.6 8 14.4z" />
						<path class="xmas-fold" d="M41 16.8C41.4 12.8 40.2 9.4 37.8 6.4" />
						<path class="xmas-band-edge" d="M7.6 14.6C17.4 10.8 30.4 12.8 40.8 19" />
						<path class="xmas-band" d="M7.6 14.6C17.4 10.8 30.4 12.8 40.8 19" />
					</g>
				</svg>
				<span class="bar-version" id="version">v0.1.0</span>
			</button>
		</div>

		<div class="bar-toast" id="toast" role="status" aria-live="polite" hidden></div>
	</main>

	<script src="js/motion.js"></script>
	<script src="js/tooltip.js"></script>
	<script src="js/bridge.js"></script>
	<script src="js/mock-host.js"></script>
	<!-- a regra do renomear: o etiquetador do host de teste (mock-host.js) -->
	<script src="../regras/regra-do-renomear.js"></script>
	<script src="js/theme.js"></script>
	<script src="icons/_snapshot.js"></script>
	<script src="js/util.js"></script>
	<script src="js/keys.js"></script>
	<script src="js/dropdown.js"></script>
	<script src="js/icons.js"></script>
	<script src="js/fontbank.js"></script>
	<script src="js/aepversion.js"></script>
	<script src="js/tour.js"></script>
	<script src="js/bar.js"></script>
</body>

</html>
