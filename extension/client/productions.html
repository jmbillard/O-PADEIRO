<!doctype html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LISTA DE PRODUÇÕES</title>
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/panel.css">
	<link rel="stylesheet" href="css/loader.css">
	<link rel="stylesheet" href="css/productions.css">
</head>

<body class="prods-page">
	<main class="prods" id="prods">
		<header class="prods-top">
			<p class="eyebrow">configuração</p>
			<div class="picker-search prods-filter">
				<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
				<input type="search" id="filter" placeholder="filtrar produções" autocomplete="off" spellcheck="false" aria-label="Filtrar produções">
				<button type="button" class="picker-clear" id="filter-clear" aria-label="Limpar filtro" hidden>×</button>
			</div>
			<div class="prods-tools">
				<button type="button" class="icon-button" id="btn-reload" title="Recarregar a lista do arquivo" aria-label="Recarregar a lista do arquivo">
					<svg viewBox="0 0 24 24" class="anim-refresh"><path d="M18.67 14.64a7.92 7.92 0 1 1-1.87-8.24L20.88 10.24" /><path d="M20.88 4.96v5.28h-5.28" /></svg>
				</button>
				<details class="actions-menu header-menu" id="app-menu">
					<summary class="icon-button" title="Mais opções" aria-label="Mais opções"><svg viewBox="0 0 24 24" class="anim-dots"><circle cx="6" cy="12" r="1.2" /><circle cx="12" cy="12" r="1.2" /><circle cx="18" cy="12" r="1.2" /></svg></summary>
					<div class="menu-popover">
						<button type="button" data-action="docs">Ajuda / documentação</button>
						<button type="button" data-action="reload">Recarregar painel</button>
					</div>
				</details>
			</div>
		</header>

		<section class="prods-sheet">
			<p class="cfg-title prods-section-title">lista de produções</p>

			<div class="prods-list" id="list">
				<div class="oven-loader is-light" role="status">
					<div class="oven" aria-hidden="true"><span class="oven-glow"></span><span class="oven-belt"><span class="loaf l1"></span><span class="loaf l2"></span><span class="loaf l3"></span></span><span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span><span class="oven-body"><span class="oven-panel"><i class="oven-knob k1"></i><i class="oven-knob k2"></i><i class="oven-knob k3"></i></span><span class="oven-door"><span class="oven-handle"></span><span class="oven-window"></span></span></span></div>
					<strong class="oven-title">lendo a lista…</strong>
					<span class="oven-hint">o arquivo fica na rede, junto do padeiro</span>
				</div>
			</div>

			<div class="prods-log" id="log-box">
				<p class="cfg-title prods-log-title">logs</p>
				<div class="log-modes" id="log-modes" role="radiogroup" aria-label="Onde gravar o log de uso">
					<label class="log-radio" title="cada preenchimento é enviado para o webhook abaixo"><input type="radio" name="log-mode" value="webhook"><span class="log-radio-dot" aria-hidden="true"></span><span class="log-radio-text">webhook</span></label>
					<label class="log-radio" title="cada preenchimento vira uma nova linha no O_PADEIRO_log.csv, na pasta de templates da produção"><input type="radio" name="log-mode" value="csv"><span class="log-radio-dot" aria-hidden="true"></span><span class="log-radio-text">CSV por produção</span></label>
					<label class="log-radio" title="cada preenchimento vira uma nova linha no O_PADEIRO_log.csv, na mesma pasta da lista de produções"><input type="radio" name="log-mode" value="csvGlobal"><span class="log-radio-dot" aria-hidden="true"></span><span class="log-radio-text">CSV global</span></label>
					<label class="log-radio" title="nada é registrado"><input type="radio" name="log-mode" value="off"><span class="log-radio-dot" aria-hidden="true"></span><span class="log-radio-text">desligado</span></label>
				</div>
				<div class="log-webhook-field" id="log-webhook-field">
					<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.1 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.1-3.6-8.5s1.2-6.2 3.6-8.5z" /></svg>
					<input type="text" class="cfg-input log-webhook" id="log-webhook" placeholder="https://servidor/webhook" spellcheck="false" autocomplete="off" aria-label="Endereço do webhook" title="endereço do webhook (http:// ou https://)">
				</div>
				<p class="cfg-hint" id="log-hint"></p>
			</div>

			<div class="action-bar is-anchored prods-bar">
				<button type="button" class="io-button" id="btn-import" title="Importar uma lista de produções" aria-label="Importar uma lista de produções">
					<svg viewBox="0 0 24 24"><path class="io-arrow" d="M12 4v10M8 10.500l4 4 4-4" /><path d="M5 18.500h14" /></svg>
				</button>
				<button type="button" class="io-button" id="btn-export" title="Exportar a lista completa" aria-label="Exportar a lista completa">
					<svg viewBox="0 0 24 24"><path class="io-arrow" d="M12 15V5M8 8.500l4-4 4 4" /><path d="M5 18.500h14" /></svg>
				</button>
				<button type="button" class="button button-secondary" id="btn-new">+ nova produção</button>
				<span class="prods-dirty" id="dirty" hidden>alterações não salvas</span>
				<button type="button" class="button button-primary" id="btn-save">Salvar lista</button>
			</div>
		</section>

		<div class="finder-toast" id="toast" role="status" aria-live="polite" hidden></div>
	</main>

	<script src="js/motion.js"></script>
	<script src="js/tooltip.js"></script>
	<script src="js/bridge.js"></script>
	<script src="js/mock-host.js"></script>
	<script src="js/util.js"></script>
	<script src="js/keys.js"></script>
	<script src="js/sortable.js"></script>
	<script src="js/productions.js"></script>
</body>

</html>
